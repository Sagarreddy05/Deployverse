apiVersion: apps/v1
kind: Deployment
metadata:
  name: deployverse-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: deployverse-frontend
  template:
    metadata:
      labels:
        app: deployverse-frontend
    spec:
      containers:
        - name: frontend
          image: deployverse-frontend:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 80
          # Readiness: only send traffic once nginx is serving
          readinessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          # Liveness: restart container if nginx stops responding
          livenessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: deployverse-frontend
spec:
  selector:
    app: deployverse-frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
  type: NodePort
