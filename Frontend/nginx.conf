# ==============================================================================
#  DeployVerse Frontend — Nginx Configuration
#
#  Two responsibilities:
#    1. Serve the React SPA with a proper try_files fallback (so reloading any
#       route doesn't return 404).
#    2. Proxy all /api/* requests to the backend ClusterIP Service inside
#       Kubernetes, so the browser never needs to know the backend address.
#
#  Service DNS used:  http://deployverse-backend:5000
#  This matches the Service name in k8s/backend-deployment.yaml exactly.
# ==============================================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── SPA fallback ──────────────────────────────────────────────────────────
    # Any path that is not a real file is served as index.html so React Router
    # (or direct URL access) works correctly.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── API reverse proxy ─────────────────────────────────────────────────────
    # All /api/* requests are forwarded to the backend service.
    # The frontend JS uses relative paths (/api/...) when VITE_API_URL is empty,
    # which is the case in the production build (.env.production).
    location /api/ {
        proxy_pass         http://deployverse-backend:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Timeouts — Jenkins trigger can take a few seconds
        proxy_connect_timeout 30s;
        proxy_read_timeout    60s;
        proxy_send_timeout    30s;
    }

    # ── Health check endpoint for K8s probes ─────────────────────────────────
    location /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # ── Security headers ──────────────────────────────────────────────────────
    add_header X-Frame-Options       "SAMEORIGIN"   always;
    add_header X-Content-Type-Options "nosniff"     always;
    add_header Referrer-Policy       "strict-origin" always;

    # ── Static asset caching ──────────────────────────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── Gzip compression ──────────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               image/svg+xml;
    gzip_min_length 1024;
}
